[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sopguard"
version = "0.1.0"
description = "Open-source runtime supervisor for business AI agents: compiles your SOP into checks, intercepts every tool call and reply, and allows, blocks, steers or escalates before outcomes reach customers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahaboob Pasha" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
demo = ["gradio>=4.40"]
dev = ["pytest>=8", "ruff>=0.5", "langgraph>=0.2", "langchain-core>=0.3"]

[project.scripts]
sopguard = "sopguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sopguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["sopguard", "evals"]
