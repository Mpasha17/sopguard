name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev,demo]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Offline eval + release gate (no API keys)
        run: |
          python -m evals.run --llm fake --out /tmp/eval_fake --fresh
          python -m evals.report /tmp/eval_fake
          python -m evals.gate /tmp/eval_fake --max-violation 0 --min-legit-success 0.95
      - name: Re-score committed real-LLM results and gate them
        run: |
          if [ -d results/heldout-llama3.2-3b ]; then
            python -m evals.report results/heldout-llama3.2-3b --out /tmp/rescored
            python -m evals.gate results/heldout-llama3.2-3b --max-violation 0.15 --min-legit-success 0.30 --max-false-intervention 0.50
          fi
      - run: sopguard compile src/sopguard/demo/northwind_sop.md
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t sopguard:ci .
      - name: Smoke-test /health
        run: |
          set -euo pipefail
          docker run -d --rm --name sopguard-ci -p 8080:8080 -e SOPGUARD_JUDGE_LLM=fake sopguard:ci
          cleanup() { docker logs sopguard-ci || true; docker stop sopguard-ci || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q '"ok"'; then
              curl -fsS http://127.0.0.1:8080/healthz >/dev/null
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
